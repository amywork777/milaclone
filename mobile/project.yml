name: Pinboard
options:
  bundleIdPrefix: com.amy.pinboard
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Pinboard:
    type: application
    platform: iOS
    sources:
      - path: Pinboard
        excludes: [Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amy.pinboard.mobile
        TARGETED_DEVICE_FAMILY: '1'
        INFOPLIST_FILE: Pinboard/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Pinboard:
    build:
      targets:
        Pinboard: all
